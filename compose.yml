services:

  postgres:
    image: postgres:17
    container_name: annex-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./docker/postgres:/var/lib/postgresql/data

    networks:
      - annex


  redis:
    image: redis:8-alpine

    container_name: annex-redis

    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD}

    env_file:
      - .env

    volumes:
      - ./docker/redis:/data

    networks:
      - annex


  n8n:
    image: docker.n8n.io/n8nio/n8n:latest

    container_name: annex-n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    env_file:
      - .env

    environment:
      DB_TYPE=sqlite

    volumes:
      - ./docker/n8n:/home/node/.n8n

    depends_on:
      - postgres
      - redis

    networks:
      - annex


networks:
  annex: